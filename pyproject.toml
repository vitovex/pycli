[project]
name = "pycli-dsl"
version = "0.3.0"
description = "A Python-compatible DevOps DSL transpiler extending Python with first-class shell command execution"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vito Vessia", email = "vito.vessia@wolterskluwer.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.40",
    "pyreadline3>=3.4.1; sys_platform == 'win32'",
]
keywords = ["devops", "dsl", "transpiler", "shell", "bash", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/vitovex/pycli"
Repository = "https://github.com/vitovex/pycli"
Issues = "https://github.com/vitovex/pycli/issues"
Documentation = "https://github.com/vitovex/pycli#readme"

[project.scripts]
pycli = "pycli:main"
spy = "pycli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pycli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
