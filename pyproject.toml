[project]
name = "pycli"
version = "0.1.0"
description = "A Python-compatible DevOps DSL transpiler extending Python with first-class shell command execution"
readme = "README.md"
authors = [
    { name = "Vito.Vessia", email = "vito.vessia@wolterskluwer.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pycli = "pycli:main"
spy = "pycli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
